<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#021c38" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Hydro Ring -->
  <circle cx="256" cy="230" r="148" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-dasharray="24 12" opacity="0.85" />
  <circle cx="256" cy="230" r="168" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.4" />

  <!-- Turbine Runner Blades / Central Hydro symbol -->
  <g transform="translate(256, 230)">
    <!-- Blade 1 -->
    <path d="M 0,-130 C 40,-120 70,-80 50,-40 C 30,-8 10,0 0,0 C -10,0 -30,-8 -50,-40 C -70,-80 -40,-120 0,-130 Z" fill="url(#cyanGrad)" />
    <!-- Blade 2 (Rotate 72 deg) -->
    <path d="M 0,-130 C 40,-120 70,-80 50,-40 C 30,-8 10,0 0,0 C -10,0 -30,-8 -50,-40 C -70,-80 -40,-120 0,-130 Z" fill="url(#cyanGrad)" transform="rotate(72)" />
    <!-- Blade 3 (Rotate 144 deg) -->
    <path d="M 0,-130 C 40,-120 70,-80 50,-40 C 30,-8 10,0 0,0 C -10,0 -30,-8 -50,-40 C -70,-80 -40,-120 0,-130 Z" fill="url(#cyanGrad)" transform="rotate(144)" />
    <!-- Blade 4 (Rotate 216 deg) -->
    <path d="M 0,-130 C 40,-120 70,-80 50,-40 C 30,-8 10,0 0,0 C -10,0 -30,-8 -50,-40 C -70,-80 -40,-120 0,-130 Z" fill="url(#cyanGrad)" transform="rotate(216)" />
    <!-- Blade 5 (Rotate 288 deg) -->
    <path d="M 0,-130 C 40,-120 70,-80 50,-40 C 30,-8 10,0 0,0 C -10,0 -30,-8 -50,-40 C -70,-80 -40,-120 0,-130 Z" fill="url(#cyanGrad)" transform="rotate(288)" />

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="#38bdf8" stroke-width="8" filter="url(#glow)" />
    <circle cx="0" cy="0" r="26" fill="url(#accentGrad)" />

    <!-- Energy Bolt in Center -->
    <path d="M 4,-14 L -8,2 L 0,2 L -4,14 L 8,-2 L 0,-2 Z" fill="#ffffff" />
  </g>

  <!-- App Label Badge at bottom: QUINCINETTO 2 -->
  <g transform="translate(256, 424)">
    <rect x="-180" y="-34" width="360" height="68" rx="20" fill="#021c38" stroke="#0284c7" stroke-width="3" />
    <text x="0" y="8" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="4" text-anchor="middle">
      QUINCINETTO 2
    </text>
  </g>
</svg>
